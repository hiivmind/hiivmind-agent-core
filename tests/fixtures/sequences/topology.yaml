nodes:
  - {name: update-sources, path: nodes/update-sources.md}
  - {name: scan, path: nodes/scan.md}
  - {name: index, path: nodes/index.md}
  - {name: verify, path: nodes/verify.md}
  - {name: publish, path: nodes/publish.md}
  - {name: status, path: nodes/status.md}
  - {name: migrate, path: nodes/migrate.md}
  - {name: graph, path: nodes/graph.md}
  - {name: asker, path: nodes/asker.md}
  - {name: wrap, path: nodes/wrap.md}
  - {name: first, path: nodes/first.md}
  - {name: close, path: nodes/close.md}
exits:
  done: route
  failed: route
fragments:
  tail:
    inputs: []
    outputs: [wrapped, closed]
    exits: [done, failed]
    start: wrap
    transitions:
      wrap: {done: close, failed: end}
      close: {done: end, failed: end}
sequences:
  refresh:
    description: Bring the corpus up to date with its sources.
    start: update-sources
    checks:
      - {tool: ready, message: "The corpus is not ready."}
      - {tool: index_is_v2, outcome: v1, message: "The index is v1."}
      - {tool: refresh_needed, outcome: current, message: "Already current."}
    transitions:
      check: {v1: {link: migrate}, current: end}
      update-sources:
        updated: {fan_out: scan, over: rescan_batches, as: batch, into: scan_results, max_concurrency: 1}
        current: end
        failed: end
      scan: {done: {node: index, inputs: {scans: scan_results}}, failed: end}
      index: {done: verify, failed: end}
      verify: {done: publish, failed: end}
      publish: {published: end, nothing-to-publish: end, failed: end}
  enrich:
    description: Re-scan the batches whose files changed.
    start: {fan_out: scan, over: {tool: stale_batches}, as: batch, into: scans}
    transitions:
      scan: {done: index, failed: end}
      index: {done: end, failed: end}
  migrate:
    description: Migrate a v1 index.
    start: migrate
    transitions:
      migrate: {done: end, failed: end, skipped: end}
  status:
    description: Say whether the corpus needs a refresh.
    start: status
    transitions:
      status: {stale: {link: refresh}, current: end, failed: end}
  graph:
    description: Work on the concept graph.
    start: graph
    inputs: {action: show}
    transitions:
      graph: {done: end, failed: end}
  chain:
    description: A short chain without a fan-out.
    start: migrate
    transitions:
      migrate: {done: {node: index, inputs: {scans: scan_results}}, failed: end}
      index: {done: verify, skipped: verify, failed: end}
      verify: {done: end, failed: end}
  ask_then_go:
    description: Offer the concepts, then finish.
    start: asker
    transitions:
      asker: {done: wrap, skipped: wrap, declined: wrap, failed: end}
      wrap: {done: end, failed: end}
  with-tail:
    description: A node, then the tail fragment.
    start: first
    transitions:
      first: {done: tail, failed: end}
