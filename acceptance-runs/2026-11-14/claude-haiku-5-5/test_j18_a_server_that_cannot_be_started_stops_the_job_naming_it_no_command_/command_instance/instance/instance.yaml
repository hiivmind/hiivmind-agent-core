name: spike-corpus
core: 0
entry: topology.yaml
policy: POLICY.md
backend: scripted
settings:
  class: settings.SpikeSettings
  files: [config/base.yaml]
  env_prefix: SPIKE_
servers:
  tools: {command: python, args: [../servers/shell_server.py]}
  web: {command: corpus-web}
tools:
  count_words: functions:count_words
  read_ledger: functions:read_ledger
  locate: functions:locate
  never_ready: checks:never_ready
  broken_check: checks:broken
  stamp_ready: checks:stamp_ready
  stamp_unready: checks:stamp_unready
