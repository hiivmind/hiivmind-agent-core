[project]
name = "agent-core"
version = "0.1.0"
description = "Harness that runs model-driven procedures for jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "jsonschema",
    "pydantic>=2",
    "mcp>=1.30,<2",
    "mountainash-settings",
    "dbos>=3.5,<4",
]

[project.scripts]
agent-core = "agent_core.cli:main"

[project.optional-dependencies]
langgraph = [
    "langchain>=1.5,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]
anthropic = [
    "anthropic>=2.8,<3",
    "langchain-anthropic>=1.7,<2",
]
openai = [
    "langchain-openai>=1,<2",
    "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "agent-tools", "agent-core[langgraph,anthropic,openai]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
include = ["src/agent_core/**/*.py", "src/agent_core/assets/*.md", "src/agent_core/core/schemas/*.json"]

[tool.uv.sources]
agent-tools = { workspace = true }
mountainash-settings = { git = "ssh://git@github.com/mountainash-io/mountainash-settings.git", rev = "7a4b43bf4789b43a808ca1520012fc413d221e64" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packages/agent-tools/tests"]
markers = ["model: calls a model provider and costs money", "feature(id): the facade feature a conformance test exercises"]
addopts = "-m 'not model'"
